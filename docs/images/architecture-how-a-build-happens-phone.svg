<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 864" style="width:100%;height:auto" role="img" aria-label="How a build happens, phone version. Nine steps from top to bottom: you say what bot you want, one plan, your yes, Toolsmith finds an app for each part, your yes for that app, Drawbridge checks the code, it runs on your computer, books and your files learn in the background, your bot can use it. The two yes points are marked in coral." aria-labelledby="hbhp-t">
<title id="hbhp-t">How a build happens (phone)</title>
