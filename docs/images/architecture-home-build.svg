<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 460" style="width:100%;height:auto" role="img" aria-label="The home build. Your computer, Home Assistant, your phone and your media drives sit inside your home network. Your router is on its edge and is the only link to the internet. The Bridge is the one lane out." aria-labelledby="hom-t">
<title id="hom-t">The home build</title>
