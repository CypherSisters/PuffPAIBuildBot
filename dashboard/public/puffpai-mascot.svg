<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 360" role="img" aria-label="PuffPAI cloud mascot">
  <!-- PuffPAI mascot: friendly cloud (vector recreation of brand mascot) -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cf8fdd"/>
      <stop offset="1" stop-color="#c67fd6"/>
    </linearGradient>
  </defs>

  <!-- back puffs (lighter rim) -->
  <g fill="#e3aeee">
    <ellipse cx="120" cy="210" rx="105" ry="78"/>
    <ellipse cx="392" cy="215" rx="108" ry="75"/>
    <ellipse cx="256" cy="120" rx="120" ry="95"/>
    <ellipse cx="150" cy="140" rx="85" ry="65"/>
    <ellipse cx="362" cy="145" rx="85" ry="62"/>
  </g>

  <!-- main body -->
  <g fill="url(#body)">
    <ellipse cx="124" cy="214" rx="96" ry="70"/>
    <ellipse cx="388" cy="219" rx="99" ry="67"/>
    <ellipse cx="256" cy="126" rx="110" ry="86"/>
    <ellipse cx="154" cy="146" rx="76" ry="57"/>
    <ellipse cx="358" cy="150" rx="76" ry="55"/>
    <ellipse cx="256" cy="228" rx="150" ry="88"/>
  </g>

  <!-- face: happy closed eyes with lashes + smile -->
  <g stroke="#3d1a55" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M212 106 q14 -16 28 0"/>
    <path d="M272 106 q14 -16 28 0"/>
    <path d="M236 138 q20 16 40 0"/>
  </g>
  <g stroke="#5b2a80" stroke-width="6" stroke-linecap="round">
    <path d="M209 88 l-6 -10"/>
    <path d="M222 84 l-3 -11"/>
    <path d="M236 84 l2 -11"/>
    <path d="M281 84 l-2 -11"/>
    <path d="M295 84 l3 -11"/>
    <path d="M308 88 l6 -10"/>
  </g>

  <!-- little cheek puffs -->
  <g fill="none" stroke="#b06cc4" stroke-width="9" stroke-linecap="round">
    <path d="M150 196 q14 -14 30 -4"/>
    <path d="M330 200 q14 -12 28 -2"/>
    <path d="M240 208 q12 -12 26 -3"/>
  </g>

  <!-- outlined mini-puff hands (signature detail — middle puff raised, if you know you know) -->
  <g fill="#cf8fdd" stroke="#7e4a9c" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <path transform="translate(146 266) rotate(-6) scale(0.92)" d="M -34 0 a 14 14 0 0 1 24 -17 L -12 -23 a 12 12 0 0 1 24 0 L 12 -17 a 14 14 0 0 1 24 17 a 34 12 0 0 1 -68 0 z"/>
    <path transform="translate(382 250) rotate(7)" d="M -34 0 a 14 14 0 0 1 24 -17 L -12 -23 a 12 12 0 0 1 24 0 L 12 -17 a 14 14 0 0 1 24 17 a 34 12 0 0 1 -68 0 z"/>
  </g>
</svg>
