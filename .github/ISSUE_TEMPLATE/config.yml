# Blank issues stay on: the templates here are a bug report, a feature
# request, a build-help request and a wizard gap; a question that fits none
# of them should not have to pretend it is a bug to be heard.
blank_issues_enabled: true
contact_links:
  - name: Security issue?
    url: https://github.com/CypherSisters/PuffPAIBuildBot/security/advisories/new
    about: Please use GitHub private vulnerability reporting instead of a public issue. See SECURITY.md.
