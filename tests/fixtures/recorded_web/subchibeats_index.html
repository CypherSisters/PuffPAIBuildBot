<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bunny's Big Day &middot; Wedding Planning Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<meta name="description" content="Bunny's Big Day — an elegant, self-contained wedding planning dashboard: guests, visual seating floor-plan, budget, timeline, vendors, checklist, and export. Your data stays in your browser." />
<meta name="color-scheme" content="light" />
<!--
  Bunny's Big Day — a single-file wedding planning dashboard.
  No build tools, no frameworks, no CDNs, no backend. Just open index.html.
  All data lives in localStorage under the key defined by STORE_KEY.
  Architecture:
    - One state object (DB) holds every record (setup, guests, tables, budget,
      timeline, vendor comparisons, locked vendors, tasks).
    - save() serialises DB to localStorage; load() restores it.
    - Each tab has a render*() function that rebuilds its DOM from DB.
    - A single generic modal/form engine (openForm) drives all add/edit dialogs.
    - All summary numbers are COMPUTED from the records, never hardcoded.
-->
<style>
  /* ----------  Design tokens  ---------- */
  :root{
    --blush:#f6e2df;
    --blush-deep:#e6b7b9;
    --sage:#a7b59a;
    --sage-deep:#7e9070;
    --ivory:#fdfaf4;
    --champagne:#c9a96a;
    --gold:#b8924f;
    --charcoal:#3b3a38;
    --muted:#8a847d;
    --line:#ece4d8;
    --card:#ffffff;
    --good:#5f9a6b;
    --warn:#c98a3c;
    --bad:#c2685f;
    --shadow:0 8px 24px rgba(91,76,60,.08);
    --shadow-sm:0 2px 8px rgba(91,76,60,.06);
    --radius:18px;
    --radius-sm:11px;
    --serif:"Cormorant Garamond","Hoefler Text",Georgia,"Times New Roman",serif;
    --sans:"Avenir Next","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    color:var(--charcoal);
    background:
      radial-gradient(1200px 600px at 100% -10%, #fbeeea 0%, transparent 55%),
      radial-gradient(1000px 500px at -10% 110%, #eef1e7 0%, transparent 55%),
      var(--ivory);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
  }
  h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;line-height:1.15;}
  a{color:var(--gold);}
  button{font-family:inherit;}

  /* ----------  Layout  ---------- */
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px 80px;}
  header.app{
    text-align:center;
    padding:30px 16px 8px;
  }
  .monogram{
    font-family:var(--serif);
    font-size:13px;letter-spacing:.42em;text-transform:uppercase;
    color:var(--gold);margin-bottom:6px;
  }
  header.app h1{font-size:clamp(32px,5vw,52px);letter-spacing:.5px;}
  .divider{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px auto 4px;max-width:340px;color:var(--blush-deep);}
  .divider::before,.divider::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--blush-deep),transparent);}
  .couple{color:var(--muted);font-size:14px;letter-spacing:.16em;text-transform:uppercase;}

  /* setup bar */
  .setup-bar{
    display:grid;grid-template-columns:repeat(6,1fr);gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin:18px 0 8px;box-shadow:var(--shadow-sm);
  }
  .setup-bar .cell{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .setup-bar .cell .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .setup-bar .cell .v{font-family:var(--serif);font-size:19px;color:var(--charcoal);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .setup-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px 0 2px;}

  /* ----------  Tabs  ---------- */
  nav.tabs{
    position:sticky;top:0;z-index:30;
    display:flex;gap:4px;flex-wrap:wrap;justify-content:center;
    background:rgba(253,250,244,.82);backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:999px;
    padding:6px;margin:16px auto 26px;box-shadow:var(--shadow-sm);
  }
  nav.tabs button{
    border:0;background:transparent;color:var(--muted);
    padding:9px 16px;border-radius:999px;cursor:pointer;
    font-size:13.5px;font-weight:600;letter-spacing:.02em;
    display:inline-flex;align-items:center;gap:7px;transition:.18s;white-space:nowrap;
  }
  nav.tabs button .ico{width:15px;height:15px;display:inline-block;}
  nav.tabs button:hover{color:var(--charcoal);background:var(--blush);}
  nav.tabs button.active{background:var(--charcoal);color:#fff;box-shadow:var(--shadow-sm);}

  /* ----------  Buttons  ---------- */
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--charcoal);
    padding:9px 15px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;
    display:inline-flex;align-items:center;gap:7px;transition:.15s;box-shadow:var(--shadow-sm);
  }
  .btn:hover{transform:translateY(-1px);border-color:var(--blush-deep);}
  .btn:active{transform:translateY(0);}
  .btn.primary{background:linear-gradient(135deg,var(--sage-deep),var(--sage));color:#fff;border-color:transparent;}
  .btn.gold{background:linear-gradient(135deg,var(--gold),var(--champagne));color:#fff;border-color:transparent;}
  .btn.ghost{background:transparent;box-shadow:none;}
  .btn.danger{color:var(--bad);border-color:#eccfca;}
  .btn.danger:hover{background:#fbeeec;}
  .btn.sm{padding:5px 10px;font-size:12px;}
  .btn.icon{padding:6px 9px;}
  .btn:focus-visible,nav.tabs button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid var(--sage-deep);outline-offset:2px;
  }

  /* ----------  Cards / sections  ---------- */
  .tab-panel{display:none;animation:fade .25s ease;}
  .tab-panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0 16px;}
  .section-head h2{font-size:27px;}
  .section-head .sub{color:var(--muted);font-size:13px;margin-top:2px;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;}
  .cards-grid{display:grid;gap:14px;}
  .stat-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));}
  .stat{position:relative;overflow:hidden;}
  .stat .label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .stat .num{font-family:var(--serif);font-size:34px;margin-top:4px;line-height:1;}
  .stat .note{font-size:12px;color:var(--muted);margin-top:5px;}
  .stat .corner{position:absolute;right:-10px;top:-12px;font-size:46px;opacity:.07;}
  .stat.accent-blush{background:linear-gradient(160deg,#fff,#fdf2f0);}
  .stat.accent-sage{background:linear-gradient(160deg,#fff,#f1f4ec);}
  .stat.accent-gold{background:linear-gradient(160deg,#fff,#faf3e6);}

  .countdown{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:4px;}
  .countdown .unit{text-align:center;min-width:74px;background:var(--ivory);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 8px;}
  .countdown .unit b{font-family:var(--serif);font-size:32px;display:block;color:var(--gold);}
  .countdown .unit span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}

  /* hero banner (Overview) */
  .hero{display:grid;grid-template-columns:320px 1fr;gap:0;background:linear-gradient(135deg,#fff,#fdf2ef 60%,#f1f4ec);
    border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px;min-height:280px;}
  .hero-photo{position:relative;overflow:hidden;background:var(--blush);}
  .hero-photo::after{content:"";position:absolute;inset:0;box-shadow:inset -40px 0 50px -30px rgba(255,255,255,.9);pointer-events:none;}
  .hero-photo img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block;}
  .hero-text{padding:26px 30px;display:flex;flex-direction:column;justify-content:center;gap:8px;}
  .hero-mono{font-family:var(--serif);font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);}
  .hero-names{font-family:var(--serif);font-size:clamp(30px,4vw,46px);line-height:1.05;color:var(--charcoal);margin:0;}
  .hero-meta{display:flex;flex-wrap:wrap;gap:7px 16px;color:var(--muted);font-size:13.5px;margin-top:4px;}
  .hero-count{margin-top:10px;align-self:flex-start;background:linear-gradient(135deg,var(--gold),var(--champagne));color:#fff;
    font-weight:700;font-size:13px;padding:7px 16px;border-radius:999px;box-shadow:var(--shadow-sm);}
  .hero.no-photo{grid-template-columns:1fr;min-height:0;text-align:center;background:linear-gradient(135deg,#fff,#fdf2ef);}
  .hero.no-photo .hero-photo{display:none;}
  .hero.no-photo .hero-text{align-items:center;}
  .hero.no-photo .hero-count{align-self:center;}
  @media(max-width:680px){
    .hero{grid-template-columns:1fr;}
    .hero-photo{height:300px;}
    .hero-photo::after{box-shadow:inset 0 -40px 50px -30px rgba(255,255,255,.9);}
  }

  /* progress */
  .progress-row{margin:14px 0;}
  .progress-row .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
  .progress-row .top b{font-weight:700;}
  .bar{height:11px;background:#efe7da;border-radius:999px;overflow:hidden;}
  .bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--sage),var(--sage-deep));transition:width .5s ease;}
  .bar.gold > i{background:linear-gradient(90deg,var(--champagne),var(--gold));}
  .bar.blush > i{background:linear-gradient(90deg,var(--blush-deep),#d98f93);}
  .bar.over > i{background:linear-gradient(90deg,#e0938b,var(--bad));}

  /* ----------  Tables  ---------- */
  .table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow-sm);}
  table.data{width:100%;border-collapse:collapse;font-size:13px;min-width:680px;}
  table.data th{
    text-align:left;font-weight:600;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
    padding:12px 12px;border-bottom:1px solid var(--line);background:#fcf8f1;position:sticky;top:0;white-space:nowrap;cursor:default;
  }
  table.data th.sortable{cursor:pointer;}
  table.data th.sortable:hover{color:var(--charcoal);}
  table.data td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  table.data tr:last-child td{border-bottom:0;}
  table.data tr:hover td{background:#fdfbf6;}
  .row-actions{display:flex;gap:5px;white-space:nowrap;}
  .empty{text-align:center;color:var(--muted);padding:34px 16px;font-style:italic;}

  /* chips / badges */
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .chip.gray{background:#f0ece4;color:var(--muted);}
  .chip.green{background:#e7f1e5;color:var(--good);}
  .chip.red{background:#fbe9e6;color:var(--bad);}
  .chip.amber{background:#fbf0dc;color:var(--warn);}
  .chip.blush{background:var(--blush);color:#b06b70;}
  .chip.sage{background:#eaf0e3;color:var(--sage-deep);}
  .chip.gold{background:#f7eccf;color:var(--gold);}
  .pill-toggle{cursor:pointer;border:0;}

  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .filters input,.filters select{
    border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13px;background:var(--card);color:var(--charcoal);
  }
  .filters input[type=search]{min-width:200px;}
  .mini-summary{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;}
  .mini-summary .ms{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 13px;box-shadow:var(--shadow-sm);}
  .mini-summary .ms b{font-family:var(--serif);font-size:21px;display:block;line-height:1;}
  .mini-summary .ms span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}

  /* ----------  Seating  ---------- */
  .seat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
  .seat-table{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:14px;display:flex;flex-direction:column;}
  .seat-table.over{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset;}
  .seat-table h4{font-size:18px;display:flex;align-items:center;gap:7px;justify-content:space-between;}
  .seat-table .cap{font-size:12px;color:var(--muted);margin:2px 0 8px;}
  .seat-list{list-style:none;margin:0;padding:0;flex:1;min-height:30px;border:1px dashed var(--line);border-radius:var(--radius-sm);padding:6px;transition:.15s;}
  .seat-list.drag-over{background:#f1f4ec;border-color:var(--sage);}
  .seat-list li{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 8px;border-radius:8px;background:var(--ivory);margin-bottom:5px;font-size:12.5px;cursor:grab;}
  .seat-list li:last-child{margin-bottom:0;}
  .seat-list li .x{cursor:pointer;color:var(--muted);border:0;background:none;font-size:14px;}
  .unassigned-pool{background:linear-gradient(160deg,#fff,#fbf1ef);}
  .pool-list{display:flex;flex-wrap:wrap;gap:7px;}
  .pool-list .g{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 8px 5px 11px;font-size:12.5px;cursor:grab;box-shadow:var(--shadow-sm);}
  .pool-list .g select{border:1px solid var(--line);border-radius:999px;font-size:11px;padding:2px 4px;}

  /* ----------  Floor-plan builder  ---------- */
  .fp-toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--shadow-sm);margin-bottom:12px;}
  .fp-toolbar .grp{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
  .fp-toolbar .sep{width:1px;align-self:stretch;background:var(--line);margin:0 3px;}
  .fp-toolbar .lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:2px;}
  .add-btn{border:1px solid var(--line);background:var(--ivory);border-radius:10px;cursor:pointer;padding:6px 9px;font-size:12px;font-weight:600;color:var(--charcoal);display:inline-flex;align-items:center;gap:6px;transition:.15s;}
  .add-btn:hover{border-color:var(--sage);background:#f1f4ec;transform:translateY(-1px);}
  .add-btn .gly{width:18px;height:18px;display:inline-grid;place-items:center;}
  .add-btn .gly svg{width:18px;height:18px;}

  .fp-stage-wrap{position:relative;border:1px solid var(--line);border-radius:var(--radius);overflow:auto;background:#fcf9f3;box-shadow:var(--shadow-sm);height:min(72vh,640px);}
  .fp-canvas{position:relative;width:1160px;height:820px;transform-origin:0 0;
    background-image:
      linear-gradient(rgba(167,181,154,.18) 1px,transparent 1px),
      linear-gradient(90deg,rgba(167,181,154,.18) 1px,transparent 1px),
      linear-gradient(rgba(167,181,154,.09) 1px,transparent 1px),
      linear-gradient(90deg,rgba(167,181,154,.09) 1px,transparent 1px);
    background-size:80px 80px,80px 80px,16px 16px,16px 16px;
  }
  /* a table = wrapper holding the top + the ring of chairs */
  .fp-item{position:absolute;cursor:grab;touch-action:none;user-select:none;}
  .fp-item.dragging{cursor:grabbing;z-index:40;}
  .fp-item.selected .fp-top{box-shadow:0 0 0 2px var(--sage-deep),0 6px 18px rgba(91,76,60,.16);}
  .fp-top{position:absolute;inset:0;z-index:3;background:linear-gradient(160deg,#ffffff,#f7f1e8);border:1.5px solid #d8cdb9;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow-sm);}
  .fp-top.round,.fp-top.oval{border-radius:50%;}
  .fp-top.square,.fp-top.rect,.fp-top.head{border-radius:12px;}
  .fp-item.over .fp-top{border-color:var(--bad);background:linear-gradient(160deg,#fff,#fbeeeb);}
  .fp-name{font-family:var(--serif);font-size:14px;line-height:1.05;color:var(--charcoal);padding:0 6px;}
  .fp-sub{font-size:10px;color:var(--muted);margin-top:1px;}
  .fp-seat{position:absolute;width:26px;height:26px;border-radius:50%;border:1.5px solid #cbbfa9;background:#fdfbf6;
    display:grid;place-items:center;font-size:8.5px;font-weight:600;color:var(--charcoal);overflow:hidden;line-height:1;text-align:center;box-shadow:inset 0 -1px 2px rgba(0,0,0,.04);}
  .fp-seat.filled{background:linear-gradient(160deg,#eaf0e3,#dbe6cf);border-color:var(--sage);color:#46603a;}
  .fp-seat.couple{background:linear-gradient(160deg,#fbe3e1,#f6cdce);border-color:var(--blush-deep);color:#9a565a;}
  .fp-seat span{transform:scale(.92);max-width:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* fixtures (dance floor, stage, bar…) */
  .fp-fx{position:absolute;cursor:grab;touch-action:none;user-select:none;border-radius:12px;border:1.5px dashed #c9bca4;
    display:grid;place-items:center;text-align:center;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9a8e76;}
  .fp-fx.selected{box-shadow:0 0 0 2px var(--sage-deep);}
  .fp-fx.floor{background:repeating-linear-gradient(45deg,#f3ece0,#f3ece0 12px,#efe6d6 12px,#efe6d6 24px);color:#8a7d64;}
  .fp-fx.stage{background:linear-gradient(160deg,#efe7f2,#e6dcec);border-color:#c3b2cc;color:#7b6a86;}
  .fp-fx.bar{background:linear-gradient(160deg,#e9f0ea,#dbe8dd);border-color:#a9c2ad;color:#5a7b60;}
  .fp-fx.gift{background:linear-gradient(160deg,#fbf1dd,#f6e7c5);border-color:#e0c98c;color:#9a7e3f;}
  .fp-fx.other{background:linear-gradient(160deg,#f4f1ec,#eae4da);color:#8a7f6e;}

  /* editor panel */
  .fp-grid{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start;}
  .fp-editor{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:15px;position:sticky;top:64px;}
  .fp-editor h3{font-size:18px;margin-bottom:3px;}
  .fp-editor .hint{font-size:12px;color:var(--muted);margin-bottom:12px;}
  .fp-editor .erow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .fp-editor .erow label{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;}
  .fp-editor input[type=text],.fp-editor input[type=number],.fp-editor select,.fp-editor textarea{
    border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:13px;background:var(--card);color:var(--charcoal);font-family:inherit;width:100%;}
  .fp-editor textarea{resize:vertical;min-height:46px;}
  .shape-row{display:flex;gap:6px;flex-wrap:wrap;}
  .shape-row button{flex:1;min-width:54px;border:1px solid var(--line);background:var(--ivory);border-radius:9px;padding:7px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--muted);transition:.15s;}
  .shape-row button.on{border-color:var(--sage-deep);background:#eef3e8;color:var(--sage-deep);}
  .shape-row button svg{width:22px;height:16px;}
  .stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .stepper button{border:0;background:var(--ivory);width:30px;height:30px;cursor:pointer;font-size:16px;color:var(--charcoal);}
  .stepper button:hover{background:#f1f4ec;}
  .stepper .val{min-width:40px;text-align:center;font-weight:700;font-size:13px;}
  .assign-list{display:flex;flex-direction:column;gap:5px;max-height:170px;overflow:auto;margin:6px 0 2px;}
  .assign-list .ar{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--ivory);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12.5px;}
  .assign-list .ar .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);}
  .seg button{border:0;background:transparent;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;}
  .seg button.on{background:var(--charcoal);color:#fff;}
  @media(max-width:820px){ .fp-grid{grid-template-columns:1fr;} .fp-editor{position:static;} }

  /* ----------  Modal  ---------- */
  .modal-back{position:fixed;inset:0;background:rgba(59,58,56,.42);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:18px;}
  .modal-back.open{display:flex;animation:fade .15s;}

  .field label{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;}

  .toast-wrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .toast{background:var(--charcoal);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);animation:fade .2s;}
  .toast.good{background:var(--sage-deep);}
  .toast.warn{background:var(--warn);}
  .toast.bad{background:var(--bad);}

  .alert{display:flex;gap:9px;align-items:flex-start;padding:11px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:10px;}
  .alert.warn{background:#fbf0dc;color:#8a6320;border:1px solid #efd9a8;}
  .alert.bad{background:#fbe9e6;color:#9a463d;border:1px solid #f0c8c1;}
  .alert.good{background:#e7f1e5;color:#3f6b48;border:1px solid #c8e0c8;}

  .task-group h3 .count{font-size:12px;color:var(--muted);font-family:var(--sans);font-weight:600;}
  .task-item{display:flex;align-items:flex-start;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:7px;box-shadow:var(--shadow-sm);}

  .task-item .t-name{font-weight:600;font-size:14px;}
  .task-item .t-meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:9px;flex-wrap:wrap;}

  @media print{

/* ============================================================
   1. CONSTANTS & STORAGE
   ============================================================ */
const STORE_KEY = "bunnysBigDay.v1";

const TABS = [
  ["overview","Overview","♥"],

const esc = (s)=> String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (v)=>{ const n=parseFloat(v); return isNaN(n)?0:n; };
const money = (n)=> "$"+ (Math.round(num(n))).toLocaleString();
const todayISO = ()=> new Date().toISOString().slice(0,10);

function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso+"T00:00:00");
  if(isNaN(d)) return iso;
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
}
function daysUntil(iso){
  if(!iso) return null;
  const d = new Date(iso+"T00:00:00"); if(isNaN(d)) return null;
  const ms = d - new Date(new Date().toDateString());
  return Math.round(ms/86400000);
}
// time helpers (work in minutes since midnight for the timeline)
function timeToMin(t){
  if(!t) return null;
  const m = String(t).trim().match(/^(\d{1,2}):(\d{2})\s*([ap]m)?$/i);
  if(!m) return null;
  let h = parseInt(m[1],10), mn = parseInt(m[2],10);
  const ap = m[3] ? m[3].toLowerCase() : null;
  if(ap){ if(ap==="pm" && h<12) h+=12; if(ap==="am" && h===12) h=0; }
  return h*60+mn;
}
function minToTime(mins){
  mins = ((mins%1440)+1440)%1440;
  let h = Math.floor(mins/60), m = mins%60;
  const ap = h>=12 ? "PM":"AM";
  let hh = h%12; if(hh===0) hh=12;
  return hh+":"+String(m).padStart(2,"0")+" "+ap;
}

/* ----------  Optional cloud sync (Supabase)  ----------
   This is 100% optional: the app is fully local-first and works offline with no
   account. If SUPABASE.url is set and the user signs in, their planner is backed
   up to their own row in Supabase (protected by Row-Level Security) and synced
   across devices. The publishable key below is safe to ship in client code —
   it only works alongside RLS policies. See SUPABASE_SETUP.md for the 1 SQL script.
*/
const SUPABASE = {
  url: "",   // e.g. "https://YOUR-REF.supabase.co" — set this to switch cloud sync on
  anonKey: "sb_publishable_BhccKqa2o967MrqUfZeqDA_gdA5zz-x",

};
const SESSION_KEY = "bunnysBigDay.session";
let SESSION = null;        // {access_token, refresh_token, expires_at, user:{id,email}}
let pushTimer = null;
function cloudEnabled(){ return !!SUPABASE.url; }

function authHeaders(useToken){
  const h={ "apikey":SUPABASE.anonKey, "Content-Type":"application/json" };
  if(useToken && SESSION) h["Authorization"]="Bearer "+SESSION.access_token;
  return h;
}
async function sbJSON(path,opts){
  const res=await fetch(SUPABASE.url+path,opts);
  let body=null; try{ body=await res.json(); }catch(_){}
  if(!res.ok) throw new Error((body&&(body.msg||body.error_description||body.message||body.error||body.error_code))||("Request failed ("+res.status+")"));
  return body;
}
function setSession(data){
  SESSION={ access_token:data.access_token, refresh_token:data.refresh_token,
    expires_at: Date.now()+(num(data.expires_in||3600)*1000),
    user: data.user?{id:data.user.id,email:data.user.email}:(SESSION&&SESSION.user) };
  try{ localStorage.setItem(SESSION_KEY,JSON.stringify(SESSION)); }catch(_){}
}
function clearSession(){ SESSION=null; try{ localStorage.removeItem(SESSION_KEY); }catch(_){} }
function loadSession(){ try{ const r=localStorage.getItem(SESSION_KEY); if(r) SESSION=JSON.parse(r); }catch(_){} }
async function authRefresh(){
  if(!SESSION||!SESSION.refresh_token) return false;
  try{ setSession(await sbJSON("/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:authHeaders(false),body:JSON.stringify({refresh_token:SESSION.refresh_token})})); return true; }
  catch(e){ clearSession(); return false; }
}
async function ensureFreshToken(){ if(SESSION && Date.now()>SESSION.expires_at-60000) await authRefresh(); }
async function authSignIn(email,password){ setSession(await sbJSON("/auth/v1/token?grant_type=password",{method:"POST",headers:authHeaders(false),body:JSON.stringify({email,password})})); }
async function authSignUp(email,password){
  const d=await sbJSON("/auth/v1/signup",{method:"POST",headers:authHeaders(false),body:JSON.stringify({email,password})});
  if(d.access_token) setSession(d);            // session present only if email confirmation is OFF
  return d;
}
async function authSignOut(){ try{ if(SESSION) await fetch(SUPABASE.url+"/auth/v1/logout",{method:"POST",headers:authHeaders(true)}); }catch(_){} clearSession(); }

async function cloudPush(){
  if(!SESSION) throw new Error("Not signed in");
  await ensureFreshToken();
  const res=await fetch(SUPABASE.url+"/rest/v1/"+SUPABASE.table+"?on_conflict=user_id",{
    method:"POST",
    headers:Object.assign(authHeaders(true),{ "Prefer":"resolution=merge-duplicates,return=minimal" }),
    body:JSON.stringify({ user_id:SESSION.user.id, data:DB, updated_at:new Date().toISOString() })
  });
  if(!res.ok) throw new Error("Cloud save failed ("+res.status+")");
}
async function cloudPull(){
  if(!SESSION) throw new Error("Not signed in");
  await ensureFreshToken();
  const res=await fetch(SUPABASE.url+"/rest/v1/"+SUPABASE.table+"?select=data,updated_at&user_id=eq."+SESSION.user.id,{headers:authHeaders(true)});
  if(!res.ok) throw new Error("Cloud load failed ("+res.status+")");
  const rows=await res.json();
  return (rows&&rows[0])||null;
}
function scheduleCloudPush(){
  if(!cloudEnabled()||!SESSION) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{ cloudPush().then(()=>setSyncStatus("Synced ✓")).catch(()=>setSyncStatus("Sync error",true)); },1500);

/* ============================================================
   5. CALCULATIONS  (explicit — never hardcoded)
   ============================================================ */
function calcGuestTotals(){
  const t={invited:0,attending:0,declined:0,awaiting:0,plusOnes:0,mealsNeeded:0,total:DB.guests.length};
  DB.guests.forEach(g=>{
    if(g.rsvp==="Invited") t.invited++;
    if(g.rsvp==="Attending") t.attending++;
    if(g.rsvp==="Declined") t.declined++;
    if(g.rsvp==="Awaiting Response") t.awaiting++;
    // a plus-one only adds a head when the guest is actually attending
    if(g.plusOne && g.rsvp==="Attending") t.plusOnes++;
  });
  // meals needed = attending guests + their attending plus-ones
  t.mealsNeeded = t.attending + t.plusOnes;
  return t;
}
function calcMealTotals(){
  // Count meals only for attending guests. Plus-ones count as one extra of the
  // same meal choice (a common simplification — couples confirm plus-one meals later).
  const counts={Chicken:0,Fish:0,Vegetarian:0,Vegan:0,Kids:0,Other:0,Unselected:0};
  DB.guests.forEach(g=>{
    if(g.rsvp!=="Attending") return;
    const heads = 1 + (g.plusOne?1:0);
    if(g.meal && counts.hasOwnProperty(g.meal)) counts[g.meal]+=heads;
    else counts.Unselected+=heads;
  });
  return counts;
}
function calcBudgetTotals(){
  // For planning we use actual cost when present, otherwise fall back to estimate.
  let est=0, actual=0, paid=0, planning=0;
  const perCategory={};
  DB.budget.forEach(b=>{
    const e=num(b.est), a=num(b.actual), d=num(b.deposit);
    est+=e; actual+=a; paid+=d;
    const effective = a>0 ? a : e;     // planning figure
    planning+=effective;
    if(!perCategory[b.category]) perCategory[b.category]={est:0,effective:0};
    perCategory[b.category].est+=e;
    perCategory[b.category].effective+=effective;
  });
  const totalBudget=num(DB.setup.budget);
  const remaining = totalBudget - planning;   // remaining vs planning spend
  return {est,actual,paid,planning,totalBudget,remaining,perCategory};
}
function balanceRemaining(b){
  // Balance Remaining = Actual Cost - Deposit Paid (fall back to estimate if no actual)
  const cost = num(b.actual)>0 ? num(b.actual) : num(b.est);
  return cost - num(b.deposit);
}
function calcTaskProgress(){
  const total=DB.tasks.length;
  const done=DB.tasks.filter(t=>t.status==="Done").length;
  const inProgress=DB.tasks.filter(t=>t.status==="In Progress").length;
  const overdue=DB.tasks.filter(t=>t.status!=="Done" && t.dueDate && daysUntil(t.dueDate)!==null && daysUntil(t.dueDate)<0).length;
  return {total,done,inProgress,outstanding:total-done,overdue,pct: total?Math.round(done/total*100):0};
}

let modalSaveHandler=null;
function openForm(title, fields, values, onSave){
  $("#modalTitle").textContent=title;
  const body=$("#modalBody");
  body.innerHTML=`<div class="form-grid">`+fields.map(f=>{
    const id="f_"+f.key;
    const val = values && values[f.key]!=null ? values[f.key] : (f.default!=null?f.default:"");
    const cls = "field"+(f.full?" full":"");
    let input;
    if(f.type==="select"){
      input=`<select id="${id}">`+ (f.placeholder?`<option value="">${esc(f.placeholder)}</option>`:"") +
        f.options.map(o=>`<option value="${esc(o)}" ${String(val)===String(o)?"selected":""}>${esc(o)}</option>`).join("")+`</select>`;
    }else if(f.type==="textarea"){
      input=`<textarea id="${id}" placeholder="${esc(f.placeholder||"")}">${esc(val)}</textarea>`;
    }else if(f.type==="checkbox"){
      input=`<select id="${id}"><option value="false" ${!val?"selected":""}>No</option><option value="true" ${val?"selected":""}>Yes</option></select>`;
    }else{
      input=`<input id="${id}" type="${f.type||"text"}" value="${esc(val)}" placeholder="${esc(f.placeholder||"")}" ${f.step?`step="${f.step}"`:""}/>`;
    }
    return `<div class="${cls}"><label for="${id}">${esc(f.label)}</label>${input}</div>`;
  }).join("")+`</div>`;

  $("#modalFooter").innerHTML=`<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="modalSaveBtn">Save changes</button>`;
  modalSaveHandler=()=>{
    const out={};
    fields.forEach(f=>{
      const el=$("#f_"+f.key);
      if(!el) return;
      let v=el.value;
      if(f.type==="number") v = v===""? "" : num(v);
      if(f.type==="checkbox") v = v==="true";
      out[f.key]=v;
    });
    onSave(out);
    closeModal();
  };
  $("#modalSaveBtn").onclick=modalSaveHandler;
  $("#modalBack").classList.add("open");
  const first=body.querySelector("input,select,textarea"); if(first) setTimeout(()=>first.focus(),60);
}
function closeModal(){ $("#modalBack").classList.remove("open"); modalSaveHandler=null; }
$("#modalBack").addEventListener("click",e=>{ if(e.target.id==="modalBack") closeModal(); });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && $("#modalBack").classList.contains("open")) closeModal();
  if(e.key==="Enter" && (e.ctrlKey||e.metaKey) && modalSaveHandler) modalSaveHandler();
});

async function doSignIn(){
  const email=($("#authEmail").value||"").trim(), pass=$("#authPass").value||"";
  if(!email||!pass){ authMsg("Enter your email and password."); return; }
  authMsg("Signing in…");
  try{ await authSignIn(email,pass); await afterSignIn(); }
  catch(e){ authMsg(e.message||"Sign-in failed."); }
}
async function doSignUp(){
  const email=($("#authEmail").value||"").trim(), pass=$("#authPass").value||"";
  if(!email||pass.length<6){ authMsg("Enter a valid email and a password of at least 6 characters."); return; }
  authMsg("Creating your account…");
  try{
    await authSignUp(email,pass);
    if(!SESSION){ authMsg("Account created — check your email to confirm, then sign in."); return; }
    await afterSignIn();
  }catch(e){ authMsg(e.message||"Sign-up failed."); }
}
async function afterSignIn(){
  let cloud=null; try{ cloud=await cloudPull(); }catch(_){}
  closeModal(); updateAccountBtn();
  if(cloud&&cloud.data){
    if(window.confirm("Found a saved planner in your account. Load it into this browser?\n\nOK = use the cloud copy · Cancel = keep this browser's data and update the cloud.")){
      DB=normalize(cloud.data); save(); renderSetup(); renderActive(); toast("Loaded from your account","good");
    } else { cloudPush().then(()=>toast("Cloud updated from this device","good")).catch(()=>{}); }
  } else {
    cloudPush().then(()=>toast("Signed in — your planner is now syncing","good")).catch(()=>toast("Signed in","good"));
  }
}
function doCloudPush(){ cloudPush().then(()=>{ closeModal(); toast("Backed up to your account","good"); }).catch(e=>toast(e.message||"Back-up failed","bad")); }
function doCloudPull(){
  cloudPull().then(row=>{
    if(!row||!row.data){ toast("No cloud copy found yet","warn"); return; }
    if(window.confirm("Replace this browser's planner with the latest from your account?")){
      DB=normalize(row.data); save(); renderSetup(); renderActive(); closeModal(); toast("Loaded latest from cloud","good");
    }
  }).catch(e=>toast(e.message||"Load failed","bad"));
}
async function doSignOut(){ await authSignOut(); closeModal(); updateAccountBtn(); toast("Signed out","good"); }

  if(b.totalBudget>0 && b.planning>b.totalBudget) out.push(alert("bad",`Projected spend (${money(b.planning)}) exceeds your budget by ${money(b.planning-b.totalBudget)}.`));
  if(tp.overdue>0) out.push(alert("warn",`${tp.overdue} task${tp.overdue>1?"s are":" is"} overdue.`));
  if(g.awaiting>0) out.push(alert("warn",`${g.awaiting} guest${g.awaiting>1?"s have":" has"} not RSVP'd yet.`));
  const noTable=DB.guests.filter(x=>x.rsvp==="Attending" && !x.table).length;
  if(noTable>0) out.push(alert("warn",`${noTable} attending guest${noTable>1?"s have":" has"} no table assigned.`));
  const noContract=DB.vendors.filter(v=>v.lockedIn && v.contractSigned!=="yes").length;
  if(noContract>0) out.push(alert("warn",`${noContract} locked-in vendor${noContract>1?"s are":" is"} missing a signed contract.`));
  if(DB.setup.guestGoal && g.total>num(DB.setup.guestGoal)) out.push(alert("warn",`Guest list (${g.total}) is over your goal of ${DB.setup.guestGoal}.`));
  if(!out.length) out.push(alert("good","You're on track — no warnings right now. ✨"));

   ============================================================ */
function sortRecords(records, key, accessor){
  const st=sortState[key];
  if(!st) return records;
  const arr=records.slice();
  arr.sort((a,b)=>{
    let x=accessor(a,st.col), y=accessor(b,st.col);
    if(typeof x==="string") x=x.toLowerCase(); if(typeof y==="string") y=y.toLowerCase();
    if(x<y) return st.dir==="asc"?-1:1;
    if(x>y) return st.dir==="asc"?1:-1;
    return 0;
  });
  return arr;
}
function toggleSort(tableKey,col,rerender){
  const st=sortState[tableKey];
  if(st && st.col===col){ st.dir = st.dir==="asc"?"desc":"asc"; }
  else sortState[tableKey]={col,dir:"asc"};
  rerender();
}

/* Distribute n chair positions around a table body of size w×h, returning {x,y}
   offsets relative to the body's center. Round/oval use an ellipse; rectangular
   shapes walk evenly around the perimeter and push each chair outward. */
function computeSeatPositions(shape,w,h,n){
  n=Math.max(1,Math.round(n)); const gap=17, out=[];
  if(shape==="head"){
    // a head/sweetheart table seats everyone along the back (top) edge, facing the room
    const y=-h/2-gap;
    for(let i=0;i<n;i++){ out.push({x: n===1?0 : -w/2 + (i+0.5)*(w/n), y}); }
    return out;
  }
  if(shape==="round"||shape==="oval"){
    const rx=w/2+gap, ry=h/2+gap;
    for(let i=0;i<n;i++){ const a=-Math.PI/2 + i*2*Math.PI/n; out.push({x:rx*Math.cos(a), y:ry*Math.sin(a)}); }
    return out;
  }
  const W=w,H=h,per=2*(W+H),step=per/n;
  for(let i=0;i<n;i++){
    let d=((i+0.5)*step)%per, x,y,nx,ny;
    if(d<W){ x=-W/2+d; y=-H/2; nx=0; ny=-1; }
    else if(d<W+H){ x=W/2; y=-H/2+(d-W); nx=1; ny=0; }
    else if(d<2*W+H){ x=W/2-(d-W-H); y=H/2; nx=0; ny=1; }
    else { x=-W/2; y=H/2-(d-2*W-H); nx=-1; ny=0; }
    out.push({x:x+nx*gap, y:y+ny*gap});
  }
  return out;
}

function addFixture(type){

  const base=({floor:[200,160],stage:[130,90],bar:[180,70],gift:[120,60],other:[140,90]})[type]||[140,90];

function fpRename(id,val){

/* ----- zoom (uses CSS zoom so the scroll area grows with the content) ----- */
function applyFpZoom(){ const c=$("#fpCanvas"); if(c) c.style.zoom=fpZoom; const v=$("#fpZoomVal"); if(v) v.textContent=Math.round(fpZoom*100)+"%"; }
function fpZoomStep(d){ fpZoom=clampN(Math.round((fpZoom+d)*10)/10,0.5,1.6); applyFpZoom(); }
function fpZoomReset(){ fpZoom=1; applyFpZoom(); }

/* ----- pointer drag for tables & fixtures (works with mouse and touch) ----- */
function attachFpDrag(){
  const canvas=$("#fpCanvas"); if(!canvas) return;
  let drag=null;
  canvas.addEventListener("pointerdown",e=>{
    const item=e.target.closest(".fp-item,.fp-fx");
    if(!item){ if(selectedFp){ selectedFp=null; renderSeating(); } return; }
    if(e.target.closest("button,select,input,textarea")) return;
    const kind=item.dataset.kind, id=item.dataset.id;
    const rec=kind==="table"?DB.tables.find(t=>t.id===id):DB.fixtures.find(f=>f.id===id);
    if(!rec) return;
    drag={item,rec,kind,id,startX:e.clientX,startY:e.clientY,ox:num(rec.x),oy:num(rec.y),moved:false,nx:num(rec.x),ny:num(rec.y)};
    try{ item.setPointerCapture(e.pointerId); }catch(_){}
    item.classList.add("dragging");
  });
  canvas.addEventListener("pointermove",e=>{
    if(!drag) return;
    const dx=(e.clientX-drag.startX)/fpZoom, dy=(e.clientY-drag.startY)/fpZoom;
    if(Math.abs(dx)>3||Math.abs(dy)>3) drag.moved=true;
    drag.nx=Math.max(0,Math.round(drag.ox+dx)); drag.ny=Math.max(0,Math.round(drag.oy+dy));
    drag.item.style.left=drag.nx+"px"; drag.item.style.top=drag.ny+"px";
  });
  const end=()=>{
    if(!drag) return;
    drag.item.classList.remove("dragging");
    if(drag.moved){ drag.rec.x=drag.nx; drag.rec.y=drag.ny; save(); }
    selectedFp={kind:drag.kind,id:drag.id};   // a click (no move) just selects
    drag=null; renderSeating();
  };
  canvas.addEventListener("pointerup",end);
  canvas.addEventListener("pointercancel",end);
}

/* ============================================================
   15. DAY-OF TIMELINE TAB

   Backward timeline logic:
   A day-of schedule is often planned BACKWARD from a fixed anchor — here, the
   "Ceremony ends" time from setup. Everything before the ceremony (hair, photos,
   first look) is scheduled by SUBTRACTING each block's duration from the anchor,
   working upward. Everything after (cocktails, dinner, dancing) is scheduled by
   ADDING durations, working downward. regenerateTimeline() rewrites the sample
   schedule so it flows out from the ceremony-end anchor while preserving the
   default running order and each item's duration.
   ============================================================ */
let timelineVendorView=false;
function renderTimeline(){
  const panel=$("#tab-timeline");
  let rows=DB.timeline.slice().sort((a,b)=>(timeToMin(a.time)??9999)-(timeToMin(b.time)??9999));
  const doneCount=rows.filter(r=>r.complete).length;

  panel.innerHTML=`
    <div class="section-head">
      <div><h2>Day-Of Timeline</h2><div class="sub">Built around your ceremony-end time of ${esc(DB.setup.ceremonyEnd?minToTime(timeToMin(DB.setup.ceremonyEnd)):"—")}. ${doneCount}/${rows.length} done.</div></div>
      <div class="toolbar">
        <button class="btn ghost sm" onclick="toggleVendorView()">${timelineVendorView?"&#9776; List view":"&#128100; Vendor view"}</button>
        <button class="btn ghost sm" onclick="regenerateTimeline()" title="Re-flow sample times from ceremony end">&#8635; Re-time from ceremony</button>
        <button class="btn primary" onclick="editTimeline()">&#43; Add Event</button>
      </div>
    </div>
    ${ timelineVendorView ? vendorViewHTML(rows) : `
    <div class="table-scroll">
      <table class="data"><thead><tr>
        <th>Done</th><th>Time</th><th>Event</th><th>Location</th><th>Assigned</th><th>Dur.</th><th>Priority</th><th>Notes</th><th>Actions</th>
      </tr></thead><tbody>
        ${rows.length? rows.map(r=>`<tr class="${r.complete?'':''}" style="${r.complete?'opacity:.55;':''}">
          <td><input type="checkbox" ${r.complete?"checked":""} onchange="toggleTimelineDone('${r.id}')" aria-label="Mark ${esc(r.event)} complete" style="width:18px;height:18px;accent-color:var(--sage-deep);"></td>
          <td><b>${esc(r.time?minToTime(timeToMin(r.time))||r.time:"—")}</b></td>
          <td><b>${esc(r.event)}</b></td>
          <td>${esc(r.location)||"—"}</td>
          <td>${esc(r.person)||"—"}</td>
          <td>${r.duration?esc(r.duration)+" min":"—"}</td>
          <td><span class="chip ${prioChip(r.priority)}">${esc(r.priority)}</span></td>
          <td>${esc(r.notes)||"—"}</td>
          <td><div class="row-actions">
            <button class="btn sm ghost" onclick="editTimeline('${r.id}')">&#9998;</button>
            <button class="btn sm danger" onclick="deleteTimeline('${r.id}')">&#10005;</button>
          </div></td>
        </tr>`).join("") : `<tr><td colspan="9" class="empty">No timeline items yet.</td></tr>`}
      </tbody></table>
    </div>`}
    <details class="help"><summary>How the backward timeline works</summary>
      The schedule is anchored to your <b>Ceremony End</b> time. “Re-time from ceremony” re-flows the
      sample events outward from that anchor — earlier prep blocks are spaced by subtracting their
      durations, later reception blocks by adding theirs — then you fine-tune any row by editing its time.
    </details>
  `;
}
function prioChip(p){return {High:"red",Medium:"amber",Low:"gray"}[p]||"gray";}
function vendorViewHTML(rows){
  const groups={};
  rows.forEach(r=>{ const k=r.person||"Unassigned"; (groups[k]=groups[k]||[]).push(r); });
  const keys=Object.keys(groups).sort();

function editTimeline(id){
  const r=id?DB.timeline.find(x=>x.id===id):{};
  openForm(id?"Edit Timeline Event":"Add Timeline Event",[

  const r=DB.timeline.find(x=>x.id===id); if(!r) return;

  });

function regenerateTimeline(){
  confirmAction("Re-flow all timeline times outward from your ceremony-end time? This overwrites current times (events & durations are kept).",()=>{
    const anchor=timeToMin(DB.setup.ceremonyEnd); if(anchor==null){ toast("Set a ceremony end time first","warn"); return; }
    // Find the anchor event ("Ceremony ends") and flow forward; if absent, flow from first row.
    const rows=DB.timeline.slice();
    let idx=rows.findIndex(r=>/ceremony ends/i.test(r.event));
    if(idx<0) idx=0;
    // forward from anchor
    let t=anchor;
    for(let i=idx;i<rows.length;i++){ rows[i].time=minToTime(t); t+=num(rows[i].duration); }
    // backward before anchor
    t=anchor;
    for(let i=idx-1;i>=0;i--){ t-=num(rows[i].duration||30); rows[i].time=minToTime(t); }
    save(); renderTimeline(); toast("Timeline re-flowed from ceremony end","good");
  });
}

            <td>${v.contractSigned==="yes"?'<span class="chip green">Signed</span>':'<span class="chip red">Missing</span>'}</td>
            <td>${v.depositPaid==="yes"?'<span class="chip green">Paid</span>':'<span class="chip amber">No</span>'}</td>
            <td>${esc(v.finalDue?fmtDate(v.finalDue):"—")}</td>

      </tbody></table>
    </div>
    <p class="note-line">Rows highlighted in peach are missing a signed contract or deposit.</p>
  `;
}
function compareMatrixHTML(){
  if(!DB.vendorCompare.length) return `<div class="empty card">No vendors to compare yet — add a few options per category.</div>`;
  const byCat={};
  DB.vendorCompare.forEach(v=>{ (byCat[v.category]=byCat[v.category]||[]).push(v); });
  const criteria=[
    ["price","Price",v=>money(v.price)],
    ["pkg","Package",v=>esc(v.pkg)||"—"],
    ["deposit","Deposit",v=>money(v.deposit)],
    ["availability","Availability",v=>esc(v.availability)||"—"],
    ["contract","Contract",v=>esc(v.contract)||"—"],
    ["rating","Rating",v=>v.rating?`&#9733; ${esc(v.rating)}`:"—"],
    ["comm","Communication",v=>esc(v.comm)||"—"],
    ["pros","Pros",v=>esc(v.pros)||"—"],
    ["cons","Cons",v=>esc(v.cons)||"—"],

    ["notes","Notes",v=>esc(v.notes)||"—"],
  ];
  return Object.keys(byCat).sort().map(cat=>{

      <h3>${esc(cat)} <span style="font-size:12px;color:var(--muted);font-weight:600;font-family:var(--sans);">${byCat[cat].length} option${byCat[cat].length>1?"s":""}</span></h3>
      <div class="vendor-compare table-scroll"><table class="data"><thead><tr>
        <th class="crit">Criteria</th>
        ${list.map(v=>`<th>${v.favorite?'&#9733; ':''}${esc(v.name)}
          <div class="row-actions" style="margin-top:5px;">
            <button class="btn sm ghost" onclick="toggleFav('${v.id}')" title="Top choice">${v.favorite?'&#9733;':'&#9734;'}</button>
            <button class="btn sm ghost" onclick="editCompare('${v.id}')">&#9998;</button>
            <button class="btn sm danger" onclick="deleteCompare('${v.id}')">&#10005;</button>
          </div></th>`).join("")}
      </tr></thead><tbody>
        ${criteria.map(([k,label,fn])=>`<tr><th class="crit">${label}</th>${list.map(v=>`<td>${fn(v)}</td>`).join("")}</tr>`).join("")}

   ============================================================ */
const taskFilter={status:"",priority:"",assigned:""};
function renderTasks(){
  const tp=calcTaskProgress();
  const panel=$("#tab-tasks");
  const assignees=[...new Set(DB.tasks.map(t=>t.assigned).filter(Boolean))];
  panel.innerHTML=`
    <div class="section-head">
      <div><h2>Tasks &amp; Checklist</h2><div class="sub">${tp.done} of ${tp.total} done · ${tp.overdue} overdue.</div></div>
      <div class="toolbar"><button class="btn primary" onclick="editTask()">&#43; Add Task</button></div>
    </div>

    <div class="card" style="margin-bottom:14px;">
      ${progressRow("Checklist completion",tp.pct,tp.pct>=60?"":"blush",`${tp.done}/${tp.total} complete · ${tp.inProgress} in progress`)}
      ${tp.overdue?alert("warn",`${tp.overdue} task${tp.overdue>1?"s are":" is"} overdue.`):""}
    </div>

    <div class="filters">
      <select id="tStatus" aria-label="Filter status"><option value="">All Status</option>${TASK_STATUS.map(s=>`<option ${taskFilter.status===s?"selected":""}>${s}</option>`).join("")}</select>
      <select id="tPrio" aria-label="Filter priority"><option value="">All Priority</option>${PRIORITIES.map(p=>`<option ${taskFilter.priority===p?"selected":""}>${p}</option>`).join("")}</select>
      <select id="tAssigned" aria-label="Filter assignee"><option value="">Anyone</option>${assignees.map(a=>`<option ${taskFilter.assigned===a?"selected":""}>${esc(a)}</option>`).join("")}</select>
      <button class="btn ghost sm" onclick="clearTaskFilter()">Clear</button>
    </div>

    <div id="taskGroups"></div>
  `;
  $("#tStatus").addEventListener("change",e=>{taskFilter.status=e.target.value;fillTaskGroups();});
  $("#tPrio").addEventListener("change",e=>{taskFilter.priority=e.target.value;fillTaskGroups();});
  $("#tAssigned").addEventListener("change",e=>{taskFilter.assigned=e.target.value;fillTaskGroups();});
  fillTaskGroups();
}
function fillTaskGroups(){
  let rows=DB.tasks.slice();
  if(taskFilter.status) rows=rows.filter(t=>t.status===taskFilter.status);
  if(taskFilter.priority) rows=rows.filter(t=>t.priority===taskFilter.priority);
  if(taskFilter.assigned) rows=rows.filter(t=>t.assigned===taskFilter.assigned);
  const wrap=$("#taskGroups");
  if(!rows.length){ wrap.innerHTML=`<div class="empty card">No tasks match these filters.</div>`; return; }
  // group by the timeline buckets, in defined order; unknown groups go last
  const order=[...TASK_GROUPS,"Other"];
  const byGroup={};
  rows.forEach(t=>{ const k=TASK_GROUPS.includes(t.group)?t.group:"Other"; (byGroup[k]=byGroup[k]||[]).push(t); });
  wrap.innerHTML=order.filter(g=>byGroup[g]).map(g=>{
    const list=byGroup[g];
    const done=list.filter(t=>t.status==="Done").length;
    return `<div class="task-group">
      <h3>${esc(g)} <span class="count">${done}/${list.length} done</span></h3>
      ${list.map(t=>taskItemHTML(t)).join("")}
    </div>`;
  }).join("");
}
function taskItemHTML(t){
  const d=t.dueDate?daysUntil(t.dueDate):null;
  const overdue=t.status!=="Done" && d!=null && d<0;
  const dueChip = t.dueDate? (t.status==="Done"?`<span class="chip green">${fmtDate(t.dueDate)}</span>` : overdue?`<span class="chip red">Overdue · ${fmtDate(t.dueDate)}</span>` : d<=14?`<span class="chip amber">${fmtDate(t.dueDate)}</span>`:`<span class="chip gray">${fmtDate(t.dueDate)}</span>`) : "";
  return `<div class="task-item ${t.status==="Done"?"done":""}">
    <input type="checkbox" ${t.status==="Done"?"checked":""} onchange="quickToggleTask('${t.id}')" aria-label="Mark ${esc(t.name)} done">
    <div class="t-main">
      <div class="t-name">${esc(t.name)}</div>
      <div class="t-meta">
        <span class="chip ${prioChip(t.priority)}">${esc(t.priority)}</span>
        <span class="chip ${t.status==="Done"?"green":t.status==="In Progress"?"amber":"gray"}">${esc(t.status)}</span>
        ${t.category?`<span>&#9656; ${esc(t.category)}</span>`:""}
        ${t.assigned?`<span>&#128100; ${esc(t.assigned)}</span>`:""}
        ${dueChip}
        ${t.notes?`<span style="color:var(--muted)">${esc(t.notes)}</span>`:""}
      </div>
    </div>
    <div class="row-actions">
      <button class="btn sm ghost" onclick="editTask('${t.id}')">&#9998;</button>
      <button class="btn sm danger" onclick="deleteTask('${t.id}')">&#10005;</button>
    </div>
  </div>`;
}
function quickToggleTask(id){
  const t=DB.tasks.find(x=>x.id===id); if(!t) return;
  t.status = t.status==="Done" ? "Not Started" : "Done";
  save(); fillTaskGroups(); refreshIfOverview();
  // update the progress bar at top
  const tp=calcTaskProgress();
}
function clearTaskFilter(){taskFilter.status="";taskFilter.priority="";taskFilter.assigned="";renderTasks();}
function editTask(id){
  const t=id?DB.tasks.find(x=>x.id===id):{};
  openForm(id?"Edit Task":"Add Task",[
    {key:"name",label:"Task Name",type:"text",full:true},
    {key:"group",label:"Timeline Group",type:"select",options:TASK_GROUPS,default:"6-9 Months Out"},
    {key:"category",label:"Category",type:"text"},
    {key:"dueDate",label:"Due Date",type:"date"},
    {key:"assigned",label:"Assigned To",type:"text"},
    {key:"status",label:"Status",type:"select",options:TASK_STATUS,default:"Not Started"},
    {key:"priority",label:"Priority",type:"select",options:PRIORITIES,default:"Medium"},
    {key:"notes",label:"Notes",type:"textarea",full:true},
  ], t, (vals)=>{
    if(id) Object.assign(t,vals); else DB.tasks.push(Object.assign({id:uid()},vals));
    save(); renderTasks(); refreshIfOverview(); toast(id?"Task updated":"Task added","good");
  });
}
function deleteTask(id){
  const t=DB.tasks.find(x=>x.id===id); if(!t) return;
  confirmAction(`Delete task "${t.name}"?`,()=>{
    DB.tasks=DB.tasks.filter(x=>x.id!==id); save(); renderTasks(); refreshIfOverview(); toast("Task deleted","bad");
  });
}

/* ---- CSV helpers ---- */
function csvCell(v){ v=String(v==null?"":v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function toCSV(headers,rows){ return [headers.map(csvCell).join(","),...rows.map(r=>r.map(csvCell).join(","))].join("\r\n"); }
function download(filename,text,mime="text/csv"){
  const blob=new Blob([text],{type:mime+";charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
  toast("Downloaded "+filename,"good");
}
function slug(){ return (DB.setup.couple||"wedding").replace(/[^a-z0-9]+/gi,"-").toLowerCase().replace(/(^-|-$)/g,""); }
function exportGuestsCSV(){
  download(slug()+"-guests.csv", toCSV(
    ["Name","Group/Household","Side","RSVP","Plus-One","Dietary","Meal","Table","Notes"],
    DB.guests.map(g=>[g.name,g.group,g.side,g.rsvp,g.plusOne?"Yes":"No",g.dietary,g.meal,g.table,g.notes])
  ));
}
function exportBudgetCSV(){
  download(slug()+"-budget.csv", toCSV(
    ["Category","Item/Vendor","Estimated","Actual","Deposit","Balance Remaining","Due Date","Paid","Notes"],
    DB.budget.map(b=>[b.category,b.item,b.est,b.actual,b.deposit,balanceRemaining(b),b.dueDate,b.paid,b.notes])
  ));
}
function exportVendorsCSV(){
  download(slug()+"-vendors.csv", toCSV(
    ["Category","Business","Contact","Phone","Email","Website","Contract Signed","Deposit Paid","Final Due","Arrival","Emergency","Notes"],
    DB.vendors.map(v=>[v.category,v.business,v.contact,v.phone,v.email,v.website,v.contractSigned,v.depositPaid,v.finalDue,v.arrival,v.emergency,v.notes])
  ));
}
function exportTimelineCSV(){
  const rows=DB.timeline.slice().sort((a,b)=>(timeToMin(a.time)??9999)-(timeToMin(b.time)??9999));
  download(slug()+"-timeline.csv", toCSV(
    ["Time","Event","Location","Assigned","Duration (min)","Priority","Complete","Notes"],
    rows.map(r=>[r.time?minToTime(timeToMin(r.time))||r.time:"",r.event,r.location,r.person,r.duration,r.priority,r.complete?"Yes":"No",r.notes])
  ));
}
function exportJSON(){
  download(slug()+"-planner-backup.json", JSON.stringify(DB,null,2),"application/json");
}
function triggerImport(){ $("#importFile").click(); }
function importJSON(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data.setup||!Array.isArray(data.guests)) throw new Error("Not a valid planner file");
      confirmAction("Import this planner? It will REPLACE all current data.",()=>{
        DB=normalize(data); save(); renderSetup(); renderActive(); toast("Planner imported","good");
      });
    }catch(err){ toast("Import failed: "+err.message,"bad"); }
    e.target.value="";
  };
  reader.readAsText(file);
}
function copySummary(){
  const g=calcGuestTotals(), b=calcBudgetTotals(), tp=calcTaskProgress(), m=calcMealTotals();
  const s=DB.setup;
  const txt=
`${s.couple||"Our Wedding"} — Planning Summary
${s.date?fmtDate(s.date)+(daysUntil(s.date)>=0?` (${daysUntil(s.date)} days to go)`:""):""}
Location: ${s.city||"—"} · Vibe: ${s.vibe||"—"}

GUESTS: ${g.total} invited · ${g.attending} attending · ${g.declined} declined · ${g.awaiting} awaiting · ${g.plusOnes} plus-ones
MEALS:  Chicken ${m.Chicken} · Fish ${m.Fish} · Veg ${m.Vegetarian} · Vegan ${m.Vegan} · Kids ${m.Kids} · Other ${m.Other} · Unselected ${m.Unselected}
BUDGET: ${money(b.totalBudget)} budget · ${money(b.planning)} projected · ${money(b.actual)} actual · ${money(b.paid)} deposits · ${money(b.remaining)} remaining
VENDORS: ${countLockedVendors()} locked in
TASKS: ${tp.done}/${tp.total} done (${tp.pct}%) · ${tp.overdue} overdue`;
  navigator.clipboard.writeText(txt).then(()=>toast("Summary copied to clipboard","good"),()=>{
    // fallback
    const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove(); toast("Summary copied","good");
  });

function printAll(){
  // Render every tab, then print. We temporarily make all panels visible.
  ["overview","guests","seating","budget","timeline","vendors","tasks"].forEach(id=>{
    ({overview:renderOverview,guests:renderGuests,seating:renderSeating,budget:renderBudget,timeline:renderTimeline,vendors:renderVendors,tasks:renderTasks}[id])();
  });
  document.querySelectorAll(".tab-panel").forEach(p=>p.classList.add("active"));
  window.print();
  // restore single-tab view after printing
  setTimeout(()=>{ document.querySelectorAll(".tab-panel").forEach(p=>p.classList.toggle("active",p.id==="tab-"+activeTab)); },300);
}

/* ============================================================
   19. RESET / NORMALIZE / INIT
   ============================================================ */
function refreshIfOverview(){ if(activeTab==="overview") renderOverview(); }
function confirmReset(){
  confirmAction("Reset everything back to the demo data? Your current planner will be erased.",()=>{
    freshDemo(); save(); renderSetup(); renderActive(); toast("Demo data restored","good");
  });
}
// ensure every expected array/field exists so blank/old files don't break the app
function normalize(d){
  d=d||{};
  d.setup=Object.assign({couple:"",date:"",guestGoal:"",budget:"",vibe:"",city:"",ceremonyEnd:""},d.setup||{});
  ["guests","tables","budget","timeline","vendorCompare","vendors","tasks","fixtures"].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; });
  // backfill ids
  ["guests","tables","budget","timeline","vendorCompare","vendors","tasks","fixtures"].forEach(k=>d[k].forEach(r=>{ if(!r.id) r.id=uid(); }));
  // backfill floor-plan layout fields on tables imported from older versions
  d.tables.forEach((t,i)=>{
    if(!t.shape) t.shape="round";
    if(t.w==null) t.w = t.shape==="head"?240:t.shape==="oval"?170:t.shape==="rect"?180:120;
    if(t.h==null) t.h = t.shape==="head"?70:t.shape==="oval"?110:t.shape==="rect"?100:120;
    if(t.x==null) t.x = 120+(i%5)*180;
    if(t.y==null) t.y = 110+Math.floor(i/5)*200;
    if(t.rot==null) t.rot=0;
    if(t.capacity==null) t.capacity=8;
  });
  return d;
}
function init(){
  if(load()) DB=normalize(DB);
  else { freshDemo(); save(); }
  loadSession();
  buildTabs();
  renderSetup();
  updateAccountBtn();
  switchTab("overview");
  // if a session was restored, refresh the token quietly in the background
  if(cloudEnabled() && SESSION){ authRefresh().then(ok=>{ if(ok) updateAccountBtn(); }); }
}
document.addEventListener("DOMContentLoaded",init);
